name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Build SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Type Checking
        run: npm run typecheck

      - name: Compile SDK Distribution
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Verify Declarations & Bundles
        run: |
          test -f dist/index.js || (echo "Missing dist/index.js" && exit 1)
          test -f dist/index.d.ts || (echo "Missing dist/index.d.ts" && exit 1)
          test -f dist/errors.js || (echo "Missing dist/errors.js" && exit 1)
          echo "All distribution artifacts verified."

      - name: Verify Open Source Governance Files
        run: |
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          test -f README.md || (echo "Missing README.md" && exit 1)
          echo "Governance documentation verified."
